apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-deployment
  namespace: default
  labels:
    app: devsecops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsecops-app
  template:
    metadata:
      labels:
        app: devsecops-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      containers:
      - name: devsecops-app
        image: DOCKERHUB_USERNAME/devsecops:v1.0.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "512Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
            ephemeral-storage: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: devsecops-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080