apiVersion: v1
kind: Service
metadata:
  name: devsecops-service
  namespace: default
spec:
  type: NodePort
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: devsecops-app
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080